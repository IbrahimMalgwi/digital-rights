name: Build and Deploy React App to Bluehost

on:
  push:
    branches:
      - main  # Triggers on every push to main branch

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Step 3: Install dependencies
      - name: Install Dependencies
        run: npm ci

      # Step 4: Run tests (optional but recommended)
      - name: Run Tests
        run: npm test -- --watchAll=false --passWithNoTests

      # Step 5: Build the React app
      - name: Build React App
        run: npm run build
        env:
          CI: false  # Prevents treating warnings as errors

      # Step 6: Deploy to Bluehost via FTP
      - name: Deploy to Bluehost via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./build/         
          server-dir: /public_html/kanunamalgwi/
          port: 21
          protocol: ftp
          dangerous-clean-slate: true # Set true ONLY on first deploy to wipe old files
